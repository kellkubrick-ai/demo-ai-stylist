services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: stylist
      POSTGRES_USER: stylist
      POSTGRES_PASSWORD: stylist
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stylist -d stylist"]
      interval: 5s
      timeout: 5s
      retries: 10
  bot:
    build: .
    profiles: ["bot"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://stylist:stylist@db:5432/stylist
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    command: ["uv", "run", "--frozen", "--no-dev", "ai-stylist", "bot"]
volumes:
  postgres_data:
