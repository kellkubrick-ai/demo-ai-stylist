[project]
name = "demo-ai-stylist"
version = "0.1.0"
description = "Catalog-grounded multimodal fashion stylist demo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "defusedxml>=0.7.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[openrouter]>=2.54.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
ai-stylist = "ai_stylist.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_stylist"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires TEST_DATABASE_URL pointing to a dedicated PostgreSQL database"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC240"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
